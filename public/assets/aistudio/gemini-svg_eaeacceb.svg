<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- AMOLED-optimized Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    
    <!-- Map Accordion Gradients (Growth & Finance) -->
    <linearGradient id="mapLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="mapCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="mapRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    
    <!-- Wealth/Goal Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    
    <!-- Material Design Depth Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="pinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Adaptive App Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Folded Map Graphic -->
  <g transform="translate(0, 5)">
    <!-- Left Fold -->
    <path d="M100 190 L204 150 L204 360 L100 400 Z" fill="url(#mapLeft)" />
    <!-- Center Fold -->
    <path d="M204 150 L308 190 L308 400 L204 360 Z" fill="url(#mapCenter)" />
    <!-- Right Fold -->
    <path d="M308 190 L412 150 L412 360 L308 400 Z" fill="url(#mapRight)" />
  </g>

  <!-- Journey/Roadmap Line -->
  <path d="M 140 335 Q 180 225 256 265 T 360 205" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-dasharray="20, 20" stroke-opacity="0.9" />
  
  <!-- Journey Start Node -->
  <circle cx="140" cy="335" r="14" fill="#FFFFFF" />

  <!-- Destination Pin with Currency -->
  <g transform="translate(360, 205) scale(2.5)" filter="url(#pinShadow)">
    <!-- Pin Body -->
    <path d="M0,0 C12,-12 20,-24 20,-36 A20,20 0 1,0 -20,-36 C-20,-24 -12,-12 0,0 Z" fill="url(#pinGrad)" />
    <!-- Pin Core Cutout -->
    <circle cx="0" cy="-36" r="13" fill="#FFFFFF" />
    <!-- Currency Symbol -->
    <text x="0" y="-30.5" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="16" fill="#D97706" text-anchor="middle">$</text>
  </g>
</svg>