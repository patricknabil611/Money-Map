<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#172033; --muted:#5B6576; --line:#D7DCE4;
  --in:#157552; --in-soft:#DDF0E6; --out:#B9372F; --out-soft:#F9E1DE; --left:#2A50CC; --left-soft:#E1E8FB;
  --yr:#9A5B00; --yr-soft:#FFEFCF; --head:#172033; --head-ink:#FFFFFF; --overlay:rgba(12,17,27,.48);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --surface:#161D28; --surface-2:#1C2533; --ink:#E6EBF2; --muted:#97A2B3; --line:#2A3445;
    --in:#55C792; --in-soft:#143428; --out:#F27A71; --out-soft:#3B1D1B; --left:#86A2FF; --left-soft:#1C2645;
    --yr:#F2B947; --yr-soft:#33270F; --head:#E6EBF2; --head-ink:#0E131B; --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface-2:#1C2533; --ink:#E6EBF2; --muted:#97A2B3; --line:#2A3445;
  --in:#55C792; --in-soft:#143428; --out:#F27A71; --out-soft:#3B1D1B; --left:#86A2FF; --left-soft:#1C2645;
  --yr:#F2B947; --yr-soft:#33270F; --head:#E6EBF2; --head-ink:#0E131B; --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--left);outline-offset:2px}
.disp{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;letter-spacing:-.02em}

/* header + tabs */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 24px 14px;max-width:1440px;margin:0 auto}
.brand h1{margin:0;font-size:30px;line-height:1;font-weight:700}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.chip{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--muted);vertical-align:middle}
.tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:12px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--muted);font-weight:500;padding:8px 16px;border-radius:9px;cursor:pointer}
.tabs button[aria-current="page"]{background:var(--head);color:var(--head-ink)}
main{max-width:1440px;margin:0 auto;padding:4px 24px 48px}
@media (max-width:720px){
  .top{padding:16px 14px 10px}
  .brand h1{font-size:26px}
  main{padding:2px 12px calc(84px + env(safe-area-inset-bottom,0px))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;border:0;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .tabs button{flex:1;padding:11px 4px;font-size:14.5px}
}
.banner{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--yr-soft);color:var(--ink);font-size:14px;border:1px solid var(--line)}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 10px}
.bar .grow{flex:1}
.bar label{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.bar select{height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 8px;font-size:14px}
.caption{font-size:12.5px;color:var(--muted);margin:8px 2px 0}

/* grid */
.grid-wrap{overflow:auto;max-height:calc(100dvh - 200px);min-height:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (max-width:720px){.grid-wrap{max-height:calc(100dvh - 250px)}}
table.grid{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
.grid th,.grid td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;text-align:right;font-weight:400;background:var(--surface)}
.grid thead{position:sticky;top:0;z-index:3}
.grid .stick{position:sticky;left:0;z-index:2;text-align:left;min-width:150px;max-width:190px;box-shadow:1px 0 0 var(--line)}
.grid thead .stick{z-index:4}
.grid .cell{display:block;width:100%;min-width:84px;padding:8px 10px;border:0;background:transparent;text-align:inherit;cursor:default;min-height:36px;line-height:20px}
.grid button.cell{cursor:pointer}
.grid button.cell:hover{background:var(--surface-2)}
.grid thead th,.grid thead td{font-weight:600}
.grid tr.h-in>*{background:var(--in-soft);color:var(--in)}
.grid tr.h-month>*{background:var(--head);color:var(--head-ink);font-weight:600}
.grid tr.h-left>*{background:var(--left-soft);color:var(--left)}
.grid tr.h-out>*{background:var(--out-soft);color:var(--out)}
.grid tr.h-left .neg{color:var(--out)}
.grid thead .lbl{padding:8px 10px;display:block}
.grid thead .v{padding:8px 10px;display:block;min-width:84px}
.grid .yr{background:var(--yr-soft)!important;color:var(--yr)!important;font-weight:600}
.grid tr.h-month .yr{background:var(--yr)!important;color:var(--head-ink)!important}
.grid tr.h-month .now{box-shadow:inset 0 -3px 0 var(--yr)}
.grid td.now{background:color-mix(in srgb,var(--left-soft) 45%,var(--surface))}
.grid .name .cell{white-space:normal;min-width:0}
.grid .nm{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.grid .sub{display:block;font-size:11.5px;color:var(--muted);line-height:1.25}
.grid tr.in .name{border-left:3px solid var(--in)}
.grid tr.out .name{border-left:3px solid var(--out)}
.grid td.muted{color:var(--muted)}
.grid td.ov .cell{text-decoration:underline dotted var(--left);text-underline-offset:3px;color:var(--left);font-weight:600}
.grid tr.sec td{background:var(--surface-2)}
.sec-in{position:sticky;left:0;display:inline-flex;align-items:center;gap:10px;padding:10px 12px;text-align:left}
.sec-in b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:15px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:999px;background:var(--yr-soft);color:var(--yr);vertical-align:1px;margin-left:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.primary{background:var(--head);color:var(--head-ink);border-color:var(--head)}
.btn.danger{color:var(--out);border-color:color-mix(in srgb,var(--out) 40%,var(--line))}
.btn.danger[data-armed="1"]{background:var(--out);color:#fff;border-color:var(--out)}
.mini{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.mini.in{color:var(--in)} .mini.out{color:var(--out)}
.mini.mariam{background:var(--head);color:var(--head-ink);border-color:var(--head)}
.ex .check{margin:0 0 10px}
.ex-tools{display:flex;gap:6px;margin:0 0 10px}
#x-out:empty{display:none}
#x-out{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.icon-btn{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1}

/* month view */
.month-pick{display:flex;gap:8px;align-items:center;margin:0 0 14px}
.month-pick select{flex:1;max-width:320px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;font-weight:600}
.slip{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 20px 16px;margin-bottom:16px}
.slip .lbl{font-size:14px;color:var(--muted)}
.slip .big{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(44px,11vw,72px);line-height:1;letter-spacing:-.035em;margin:6px 0 14px;color:var(--left)}
.slip .big.neg{color:var(--out)}
.meter{height:12px;border-radius:999px;background:var(--in-soft);overflow:hidden}
.meter span{display:block;height:100%;background:var(--out);border-radius:999px}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin:14px 0 0}
.stats div{min-width:110px}
.stats dt{font-size:12.5px;color:var(--muted)}
.stats dd{margin:0;font-weight:600;font-size:18px}
.in-c{color:var(--in)} .out-c{color:var(--out)} .left-c{color:var(--left)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:17px}
.card-h .num{font-weight:600}
.items{list-style:none;margin:0;padding:0}
.items>li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.items>li:first-child{border-top:0}
.it{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:transparent;padding:0;text-align:left;cursor:default}
button.it{cursor:pointer}
.day{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--surface-2);color:var(--muted)}
.it-main{flex:1;min-width:0}
.it-main .nm{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12.5px;color:var(--muted)}
.it-amt{font-weight:600;white-space:nowrap}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex:none;cursor:pointer}
.chk input,.bul input{width:20px;height:20px;accent-color:var(--in);cursor:pointer}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}

/* loans */
.loan-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 14px}
.loan-top .big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(36px,9vw,54px);line-height:1;letter-spacing:-.03em}
.loans{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.loan{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.loan-head{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;width:100%;padding:14px 16px;border:0;background:transparent;text-align:left;cursor:pointer}
.loan-head .nm{font-weight:600;font-size:16px}
.loan-head .amt{font-weight:700;font-size:18px;text-align:right}
.loan-head .sub.r{text-align:right}
.loan-head .meter{grid-column:1/-1;height:8px;margin-top:8px}
.loan-head .meter span{background:var(--in)}
.loan-head .meter{background:var(--surface-2)}
.caret{display:inline-block;transition:transform .15s;color:var(--muted);margin-right:6px}
.loan-head[aria-expanded="true"] .caret{transform:rotate(90deg)}
.loan-body{border-top:1px solid var(--line);padding:6px 16px 14px}
.bul{list-style:disc;margin:6px 0 10px;padding-left:20px}
.bul li{padding:6px 0}
.bul label{display:flex;align-items:center;gap:10px;cursor:pointer}
.bul .m{flex:1}
.bul .paid .m,.bul .paid .num{color:var(--muted);text-decoration:line-through}
.loan-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:16px;border-radius:14px;background:var(--head);color:var(--head-ink)}
.loan-foot strong{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:26px}
@media (prefers-reduced-motion:reduce){.caret{transition:none}}

/* sha2a */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px}
.tile{border-radius:14px;padding:14px 16px;color:#fff}
.tile dt{font-size:13px;opacity:.9}
.tile dd{margin:4px 0 0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(22px,5.5vw,34px);line-height:1.05}
.tile.t-in{background:#157552} .tile.t-out{background:#B9372F} .tile.t-diff{background:#2A50CC}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}.tile.t-diff{grid-column:1/-1}}
.ledger .no{flex:none;width:26px;color:var(--muted);font-size:13px}
.photos{margin-top:18px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:14px}
.ph{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);padding:0;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:left}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);color:var(--ink);width:100%;max-width:540px;max-height:90dvh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.panel.wide{max-width:900px}
@media (min-width:721px){.overlay{align-items:center;padding:20px}.panel{border-radius:20px;padding-bottom:18px}}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:22px;line-height:1.15}
.sheet-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.x{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;line-height:1;cursor:pointer}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.f input,.f select{width:100%;height:46px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:16px}
.f input:focus,.f select:focus{border-color:var(--left);outline:none;box-shadow:0 0 0 3px var(--left-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);margin:0 0 12px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid var(--left)}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.hint.plan{color:var(--left);font-weight:500}
.err{color:var(--out);font-size:13.5px;margin:0 0 10px;font-weight:500}
fieldset.steps{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:0 0 12px}
fieldset.steps legend{font-size:13px;color:var(--muted);padding:0 4px}
.step{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;align-items:end;margin-bottom:8px}
.step .f{margin:0}
.check{display:flex;gap:10px;align-items:center;margin:0 0 14px;font-size:14.5px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--in)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.actions .sp{flex:1}
.stack{display:grid;gap:8px}
.lb-img{width:100%;max-height:68dvh;object-fit:contain;border-radius:12px;background:var(--surface-2);display:block;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--head);color:var(--head-ink);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,460px);box-shadow:0 6px 24px rgba(0,0,0,.25);display:none}
@media (min-width:721px){#toast{bottom:28px}}
.skel{padding:40px 16px;text-align:center;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 class="disp">Money map</h1>
    <p id="subtitle">Patrick’s budget</p>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" data-act="tab" data-tab="home">Home</button>
    <button type="button" data-act="tab" data-tab="month">Month</button>
    <button type="button" data-act="tab" data-tab="sha2a">Sha2a</button>
    <button type="button" data-act="tab" data-tab="loans">Loans</button>
  </nav>
</header>
<main id="app"><div class="skel">Loading your budget…</div></main>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const DEFAULTS={start:'2026-11',end:'2027-12'};
const TABS=['home','month','sha2a','loans'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Math.round(Number(n)||0);return (n<0?'−':'')+Math.abs(n).toLocaleString('en-US')};
const clone=o=>JSON.parse(JSON.stringify(o==null?null:o));
const mk=(y,m)=>y+'-'+String(m).padStart(2,'0');
const validM=s=>/^\d{4}-(0[1-9]|1[0-2])$/.test(String(s||''));
const mIdx=s=>{const p=String(s).split('-').map(Number);return p[0]*12+(p[1]-1)};
const mOf=i=>mk(Math.floor(i/12),(i%12)+1);
const mLabel=s=>{const i=mIdx(s);return MN[i%12]+' '+Math.floor(i/12)};
const yearOf=s=>Math.floor(mIdx(s)/12);
const mRange=(a,b)=>{const o=[];for(let i=mIdx(a);i<=mIdx(b);i++)o.push(mOf(i));return o};
const NOW=new Date();
const CUR=mk(NOW.getFullYear(),NOW.getMonth()+1);
const ALL_MONTHS=mRange('2024-01','2032-12');
const num=v=>{if(v==null)return null;const s=String(v).replace(/[,\s]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));if(s==='')return null;const n=Number(s);return isFinite(n)?n:NaN};
const sumBy=(arr,f)=>arr.reduce((s,x)=>s+(f(x)||0),0);
const has=(o,k)=>!!o&&Object.prototype.hasOwnProperty.call(o,k);
const ord=d=>{d=Number(d);const s=['th','st','nd','rd'],v=d%100;return d+(s[(v-20)%10]||s[v]||s[0])};

/* ---------- state ---------- */
const S={rows:[],settings:{...DEFAULTS},sha2a:[],photos:[],mode:'connecting',canManage:false,assetsOk:false,
  tab:'home',month:CUR,openLoans:new Set(),uploading:0,loaded:false,who:'',scrolledToNow:false};
let db=null,assets=null,downloads=null;
let cache=new WeakMap();

function range(){
  let a=validM(S.settings.start)?S.settings.start:DEFAULTS.start;
  let b=validM(S.settings.end)?S.settings.end:DEFAULTS.end;
  if(mIdx(b)<mIdx(a))b=a;
  return [a,b];
}

/* ---------- schedule engine ---------- */
function rateAt(r,m){
  let a=Number(r.amount)||0;
  const steps=(Array.isArray(r.steps)?r.steps:[]).filter(s=>s&&validM(s.from)).slice().sort((x,y)=>mIdx(x.from)-mIdx(y.from));
  for(const s of steps){if(mIdx(s.from)<=mIdx(m))a=Number(s.amount)||0}
  return a;
}
function computeSched(r){
  const start=validM(r.start)?r.start:range()[0];
  const every=Math.max(1,Math.floor(Number(r.every)||1));
  const months=r.months!=null&&r.months!==''&&Number(r.months)>0?Math.floor(Number(r.months)):null;
  const total=r.total!=null&&r.total!==''&&Number(r.total)>0?Number(r.total):null;
  const finite=months!=null||total!=null;
  const ov=r.overrides&&typeof r.overrides==='object'?r.overrides:{};
  const ovI=Object.keys(ov).filter(validM).map(mIdx);
  const lastOv=ovI.length?Math.max(...ovI):-Infinity;
  const s0=mIdx(start);
  const endCap=finite?s0+600:Math.max(mIdx(range()[1]),mIdx(CUR),s0);
  const map={},list=[];let paid=0;
  for(let i=s0;i<=endCap;i++){
    const m=mOf(i),el=i-s0;let a=0;
    if(el%every===0&&(months==null||el/every<months))a=rateAt(r,m);
    if(has(ov,m))a=Math.max(0,Number(ov[m])||0);
    if(total!=null)a=Math.min(a,Math.max(0,total-paid));
    if(a>0){map[m]=a;list.push(m);paid+=a}
    if(finite&&i>=lastOv){
      if((total!=null&&paid>=total-1e-6)||(months!=null&&el>=(months-1)*every))break;
    }
  }
  return {map,list,planned:paid,finite,total,every,first:list[0]||null,last:list[list.length-1]||null};
}
function sched(r){let s=cache.get(r);if(!s){s=computeSched(r);cache.set(r,s)}return s}
const amt=(r,m)=>sched(r).map[m]||0;
function planAmt(r,m){const c=clone(r);if(c.overrides)delete c.overrides[m];return computeSched(c).map[m]||0}
function remainingAfter(r,m){
  const sc=sched(r);if(!sc.finite)return null;
  let upto=0;for(const x of sc.list)if(mIdx(x)<=mIdx(m))upto+=sc.map[x];
  return sc.total!=null?Math.max(0,sc.total-upto):sc.planned-upto;
}
function loanInfo(r){
  const sc=sched(r);const total=sc.total!=null?sc.total:sc.planned;
  const paid=sumBy(sc.list,m=>r.paid&&r.paid[m]?sc.map[m]:0);
  return {sc,total,paid,remaining:Math.max(0,total-paid)};
}
const byOrder=(a,b)=>((a.order??9999)-(b.order??9999))||String(a.name).localeCompare(String(b.name));
const ins=()=>S.rows.filter(r=>r.kind==='in').sort(byOrder);
const outs=()=>S.rows.filter(r=>r.kind!=='in').sort(byOrder);
const income=m=>sumBy(ins(),r=>amt(r,m));
const expenses=m=>sumBy(outs(),r=>amt(r,m));
function everyText(e){return e===1?'a month':e===12?'a year':'every '+e+' months'}

/* ---------- writes ---------- */
const chains=new Map();
function queue(key,fn){
  const p=(chains.get(key)||Promise.resolve()).catch(()=>{}).then(fn);
  chains.set(key,p);
  return p.then(()=>true,e=>{onWriteErr(e);return false});
}
function onWriteErr(e){
  const code=e&&e.code;
  if(code==='invalid_argument'){S.canManage=false;S.assetsOk=false;toast('This account can view the budget but can’t change it.');scheduleRender()}
  else if(code==='quota_exceeded')toast('Storage is full. Delete a few receipts or rows, then try again.');
  else if(code==='revoked'){S.canManage=false;scheduleRender()}
  else toast('That change wasn’t saved. Check your connection and try again.');
}
function newId(col){
  if(db&&S.mode==='live'){try{return db.collection(col).doc().id}catch(e){}}
  return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
function localApply(col,id,body){
  if(col==='settings'){S.settings={...DEFAULTS,...(body||{})};scheduleRender();return}
  const key=col==='rows'?'rows':col==='sha2a'?'sha2a':'photos';
  const arr=S[key].filter(x=>x.id!==id);
  if(body)arr.push({id,...body});
  S[key]=arr;scheduleRender();
}
function setDoc(col,id,data){
  const body=clone(data);delete body.id;
  if(S.mode!=='live'){localApply(col,id,body);return Promise.resolve(true)}
  return queue(col+'/'+id,()=>db.collection(col).doc(id).set(body));
}
function delDoc(col,id){
  if(S.mode!=='live'){localApply(col,id,null);return Promise.resolve(true)}
  return queue(col+'/'+id,()=>db.collection(col).doc(id).delete());
}
const saveRow=r=>setDoc('rows',r.id,r);

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none'},3800)}

/* ---------- render ---------- */
let rq=false;
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function render(){
  cache=new WeakMap();
  document.querySelectorAll('#tabs button').forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  const [a,b]=range();
  $('#subtitle').innerHTML=esc('Patrick’s budget, '+mLabel(a)+' to '+mLabel(b))+(S.mode==='live'&&!S.canManage?'<span class="chip">View only</span>':'');
  const gw=$('.grid-wrap');const keep=gw&&S.tab==='home'?{l:gw.scrollLeft,t:gw.scrollTop}:null;
  let banner='';
  if(S.mode==='local')banner='<p class="banner">This preview doesn’t save anything. Open the published page on claude.ai to keep your changes.</p>';
  if(S.mode==='nodb')banner='<p class="banner">Your saved budget isn’t available in this view. Sign in to claude.ai and open the page again.</p>';
  let body='';
  if(S.mode==='connecting')body='<div class="skel">Loading your budget…</div>';
  else if(S.tab==='home')body=renderHome();
  else if(S.tab==='month')body=renderMonth();
  else if(S.tab==='sha2a')body=renderSha2a();
  else body=renderLoans();
  $('#app').innerHTML=banner+body;
  const ng=$('.grid-wrap');
  if(ng&&keep){ng.scrollLeft=keep.l;ng.scrollTop=keep.t}
  else if(ng&&!S.scrolledToNow&&S.loaded){
    S.scrolledToNow=true;
    const now=ng.querySelector('thead .now');const st=ng.querySelector('thead .stick');
    if(now&&st)ng.scrollLeft=Math.max(0,now.offsetLeft-st.offsetWidth-8);
  }
}

function monthSelect(name,val,id){
  return `<select ${id?`id="${id}"`:''} name="${name}">${ALL_MONTHS.map(m=>`<option value="${m}"${m===val?' selected':''}>${mLabel(m)}</option>`).join('')}</select>`;
}

/* Home */
function renderHome(){
  const [a,b]=range();const months=mRange(a,b);
  const cols=[];
  months.forEach((m,i)=>{cols.push({t:'m',m});const n=months[i+1];if(!n||yearOf(n)!==yearOf(m))cols.push({t:'y',y:yearOf(m),upto:m,ms:months.filter(x=>yearOf(x)===yearOf(m))})});
  const I=ins(),O=outs();const nc=3+cols.length;
  const ysum=(c,f)=>sumBy(c.ms,f);
  const hr=(cls,label,f,yf)=>`<tr class="${cls}"><th class="stick" scope="row"><span class="lbl">${label}</span></th><td></td><td></td>${cols.map(c=>{
    if(c.t==='m'){const v=f(c.m);return `<td class="num${c.m===CUR?' now':''}"><span class="v${v<0?' neg':''}">${fmt(v)}</span></td>`}
    const v=yf(c);return `<td class="num yr"><span class="v${v<0?' neg':''}">${fmt(v)}</span></td>`}).join('')}</tr>`;
  const monthRow=`<tr class="h-month"><th class="stick" scope="col"><span class="lbl">Item</span></th><th scope="col"><span class="lbl">Day</span></th><th scope="col"><span class="lbl">Amount</span></th>${cols.map(c=>c.t==='m'?`<th scope="col" class="${c.m===CUR?'now':''}"><span class="v">${mLabel(c.m)}</span></th>`:`<th scope="col" class="yr"><span class="v">End of ${c.y}</span></th>`).join('')}</tr>`;
  const thead=`<thead>${hr('h-in','Income',income,c=>ysum(c,income))}${monthRow}${hr('h-left','Left over',m=>income(m)-expenses(m),c=>ysum(c,m=>income(m)-expenses(m)))}${hr('h-out','Expenses',expenses,c=>ysum(c,expenses))}</thead>`;
  const rowTr=r=>{
    const sc=sched(r);const e=sc.every;
    let sub='';
    if(sc.finite&&sc.last)sub=fmt(rateAt(r,a))+' '+everyText(e)+', ends '+mLabel(sc.last);
    else if(sc.finite)sub='Finished';
    else if(e>1)sub=everyText(e);
    const amountCol=sc.finite?(sc.total!=null?sc.total:sc.planned):rateAt(r,a);
    const nameInner=`<span class="nm">${esc(r.name)}${r.isLoan?'<span class="tag">Loan</span>':''}</span>${sub?`<span class="sub">${esc(sub)}</span>`:''}`;
    const name=S.canManage?`<button type="button" class="cell" data-act="edit" data-id="${esc(r.id)}">${nameInner}</button>`:`<div class="cell">${nameInner}</div>`;
    const cells=cols.map(c=>{
      if(c.t==='y'){const rem=remainingAfter(r,c.upto);return `<td class="num yr"><span class="cell">${rem==null?'':fmt(rem)}</span></td>`}
      const v=amt(r,c.m);const ov=has(r.overrides,c.m);const txt=v?fmt(v):'';
      const inner=S.canManage?`<button type="button" class="cell" data-act="cell" data-id="${esc(r.id)}" data-m="${c.m}" aria-label="${esc(r.name)}, ${mLabel(c.m)}: ${txt||'none'}">${txt||'&nbsp;'}</button>`:`<span class="cell">${txt||'&nbsp;'}</span>`;
      return `<td class="num${c.m===CUR?' now':''}${ov?' ov':''}">${inner}</td>`;
    }).join('');
    return `<tr class="${r.kind==='in'?'in':'out'}"><th class="stick name" scope="row">${name}</th><td class="num muted"><span class="cell" style="min-width:44px">${r.day?esc(r.day):''}</span></td><td class="num"><span class="cell">${fmt(amountCol)}</span></td>${cells}</tr>`;
  };
  const sec=(label,kind,btn)=>`<tr class="sec"><td colspan="${nc}"><div class="sec-in"><b>${label}</b>${S.canManage?`<button type="button" class="mini ${kind}" data-act="add" data-kind="${kind}">${btn}</button>`:''}</div></td></tr>`;
  const emptyRow=t=>`<tr><td colspan="${nc}"><div class="sec-in sub" style="padding:12px">${t}</div></td></tr>`;
  const tbody=`<tbody>${sec('Money in','in','Add income')}${I.length?I.map(rowTr).join(''):emptyRow('No income yet. Add your salary first.')}${sec('Money out','out','Add expense')}${O.length?O.map(rowTr).join(''):emptyRow('No expenses yet.')}</tbody>`;
  const exportBtn='<button type="button" class="mini mariam" data-act="export">Export to Mariam</button>';
  const bar=S.canManage
    ?`<div class="bar"><label>From ${monthSelect('rs',a,'range-start')}</label><label>To ${monthSelect('re',b,'range-end')}</label><span class="grow"></span>${exportBtn}<button type="button" class="mini in" data-act="add" data-kind="in">Add income</button><button type="button" class="mini out" data-act="add" data-kind="out">Add expense</button></div>`
    :`<div class="bar"><span class="grow"></span>${exportBtn}</div>`;
  return `${bar}<div class="grid-wrap"><table class="grid">${thead}${tbody}</table></div><p class="caption">The End of year column shows the year’s totals in the top rows, and how much is still left to pay on each item.${S.canManage?' Tap a name to edit the row, or tap any amount to change one month.':''}</p>`;
}

/* Month */
function monthOptions(){
  let [a,b]=range();
  S.rows.forEach(r=>{if(validM(r.start)&&mIdx(r.start)<mIdx(a))a=r.start});
  if(mIdx(CUR)<mIdx(a))a=CUR;if(mIdx(CUR)>mIdx(b))b=CUR;
  return mRange(a,b);
}
function payInfo(r,m){
  const sc=sched(r);
  if(!sc.finite)return sc.every>1?'Every '+sc.every+' months':(r.kind==='in'?'Monthly':'Every month');
  const i=sc.list.indexOf(m)+1;const rem=remainingAfter(r,m);
  return `Payment ${i} of ${sc.list.length}, ${rem>0?fmt(rem)+' left after this':'last one'}`;
}
function renderMonth(){
  const opts=monthOptions();
  if(!opts.includes(S.month))S.month=opts.includes(CUR)?CUR:opts[0];
  const m=S.month;const i=opts.indexOf(m);
  const I=ins().filter(r=>amt(r,m)>0);
  const O=outs().filter(r=>amt(r,m)>0).sort((x,y)=>(Number(x.day)||99)-(Number(y.day)||99)||byOrder(x,y));
  const inc=sumBy(I,r=>amt(r,m)),exp=sumBy(O,r=>amt(r,m)),left=inc-exp;
  const pct=inc>0?Math.min(100,exp/inc*100):(exp>0?100:0);
  const item=r=>{
    const v=amt(r,m);
    const inner=`<span class="day">${r.day?esc(r.day):'–'}</span><span class="it-main"><span class="nm">${esc(r.name)}${r.isLoan?' <span class="tag">Loan</span>':''}</span><span class="sub">${esc(payInfo(r,m))}</span></span><span class="it-amt num ${r.kind==='in'?'in-c':''}">${fmt(v)}</span>`;
    const main=S.canManage?`<button type="button" class="it" data-act="cell" data-id="${esc(r.id)}" data-m="${m}">${inner}</button>`:`<div class="it">${inner}</div>`;
    const chk=r.isLoan?`<label class="chk"><input type="checkbox" data-act="paid" data-id="${esc(r.id)}" data-m="${m}"${r.paid&&r.paid[m]?' checked':''}${S.canManage?'':' disabled'}>Paid</label>`:'';
    return `<li>${main}${chk}</li>`;
  };
  return `<div class="month-pick">
    <button type="button" class="icon-btn" data-act="mprev" aria-label="Previous month"${i<=0?' disabled':''}>‹</button>
    <label class="sr" for="month-sel">Month</label>
    <select id="month-sel" data-act="msel">${opts.map(x=>`<option value="${x}"${x===m?' selected':''}>${mLabel(x)}${x===CUR?' (this month)':''}</option>`).join('')}</select>
    <button type="button" class="icon-btn" data-act="mnext" aria-label="Next month"${i>=opts.length-1?' disabled':''}>›</button>
  </div>
  <section class="slip" aria-label="Summary for ${mLabel(m)}">
    <span class="lbl">Left over in ${mLabel(m)}</span>
    <strong class="big num${left<0?' neg':''}">${fmt(left)}</strong>
    <div class="meter" role="img" aria-label="Expenses take ${Math.round(pct)}% of income"><span style="width:${pct.toFixed(1)}%"></span></div>
    <dl class="stats">
      <div><dt>Income</dt><dd class="num in-c">${fmt(inc)}</dd></div>
      <div><dt>Expenses</dt><dd class="num out-c">${fmt(exp)}</dd></div>
      <div><dt>Share of income spent</dt><dd class="num">${inc>0?Math.round(exp/inc*100)+'%':'–'}</dd></div>
    </dl>
  </section>
  <div class="cols">
    <section class="card"><div class="card-h"><h2 class="disp">Money in</h2><span class="num in-c">${fmt(inc)}</span></div>${I.length?`<ul class="items">${I.map(item).join('')}</ul>`:'<p class="empty">No income this month.</p>'}</section>
    <section class="card"><div class="card-h"><h2 class="disp">Money out, by day</h2><span class="num out-c">${fmt(exp)}</span></div>${O.length?`<ul class="items">${O.map(item).join('')}</ul>`:'<p class="empty">Nothing to pay this month.</p>'}</section>
  </div>`;
}

/* Loans */
function renderLoans(){
  const L=S.rows.filter(r=>r.isLoan).sort(byOrder);
  const infos=L.map(r=>({r,...loanInfo(r)}));
  const tot=sumBy(infos,x=>x.total),rem=sumBy(infos,x=>x.remaining);
  const head=`<div class="loan-top"><div><span class="sub">Total amount</span><div class="big num">${fmt(tot)}</div></div>${S.canManage?'<button type="button" class="btn primary" data-act="add" data-kind="out" data-loan="1">Add loan</button>':''}</div>`;
  if(!L.length)return head+`<div class="card"><p class="empty">No loans yet.${S.canManage?' Add one here, or tick “Show in Loans” on any expense.':''}</p></div>`;
  const items=infos.map(x=>{
    const open=S.openLoans.has(x.r.id);const pct=x.total>0?Math.min(100,x.paid/x.total*100):0;
    const sc=x.sc;
    const rate=sc.list.length?sc.map[sc.list[0]]:0;
    const sub=sc.list.length?`${fmt(rate)} ${everyText(sc.every)}, ${mLabel(sc.first)} to ${mLabel(sc.last)}`:'No payments scheduled';
    const bullets=sc.list.map(m=>{const p=!!(x.r.paid&&x.r.paid[m]);return `<li class="${p?'paid':''}"><label><input type="checkbox" data-act="paid" data-id="${esc(x.r.id)}" data-m="${m}"${p?' checked':''}${S.canManage?'':' disabled'}><span class="m">${mLabel(m)}${m===CUR?' (this month)':''}</span><span class="num">${fmt(sc.map[m])}</span></label></li>`}).join('');
    return `<li class="loan">
      <button type="button" class="loan-head" data-act="toggle-loan" data-id="${esc(x.r.id)}" aria-expanded="${open}">
        <span class="nm"><span class="caret" aria-hidden="true">›</span>${esc(x.r.name)}</span>
        <span class="amt num">${fmt(x.remaining)}</span>
        <span class="sub">${esc(sub)}</span>
        <span class="sub r num">left of ${fmt(x.total)}</span>
        <span class="meter" aria-hidden="true"><span style="width:${pct.toFixed(1)}%"></span></span>
      </button>
      ${open?`<div class="loan-body"><ul class="bul">${bullets||'<li>No payments scheduled.</li>'}</ul><div class="actions"><span class="sub">Paid so far: <b class="num">${fmt(x.paid)}</b></span><span class="sp"></span>${S.canManage?`<button type="button" class="mini" data-act="edit" data-id="${esc(x.r.id)}">Edit loan</button>`:''}</div></div>`:''}
    </li>`;
  }).join('');
  return head+`<ul class="loans">${items}</ul><div class="loan-foot"><span>Total remaining</span><strong class="num">${fmt(rem)}</strong></div><p class="caption">Loans also show up as expenses on Home and in the Month view.</p>`;
}

function openRowEditor(id,preset){
  const isNew=!id;
  let d;
  if(id){const r=S.rows.find(x=>x.id===id);if(!r)return;d=clone(r)}
  else{const k=preset.kind==='in'?'in':'out';d={id:newId('rows'),kind:k,name:'',day:null,amount:null,start:mIdx(CUR)>=mIdx(range()[0])?CUR:range()[0],every:1,months:null,total:null,steps:[],overrides:{},isLoan:!!preset.loan,paid:{},order:nextOrder(k)}}
  d.steps=Array.isArray(d.steps)?d.steps:[];d.overrides=d.overrides||{};d.paid=d.paid||{};
  let err='';
  const draw=()=>{
    const title=isNew?(d.isLoan?'New loan':d.kind==='in'?'New income':'New expense'):'Edit '+esc(d.name||'row');
    const panel=openSheet(`<div class="sheet-head"><div><h2 class="disp">${title}</h2></div><button type="button" class="x" data-act="close" aria-label="Close">×</button></div>
    <form id="ed" novalidate>
      <div class="seg" role="radiogroup" aria-label="Type">
        <label><input type="radio" name="f_kind" value="in"${d.kind==='in'?' checked':''}><span>Money in</span></label>
        <label><input type="radio" name="f_kind" value="out"${d.kind!=='in'?' checked':''}><span>Money out</span></label>
      </div>
      <label class="f"><span>Name</span><input name="f_name" value="${esc(d.name)}" autocomplete="off" placeholder="${d.kind==='in'?'Salary, Rent…':'Car installment, Internet…'}"></label>
      <div class="row2">
        <label class="f"><span>Amount each time</span><input name="f_amount" inputmode="decimal" value="${d.amount!=null?esc(d.amount):''}" placeholder="0"></label>
        <label class="f"><span>Day of month</span><input name="f_day" inputmode="numeric" value="${d.day!=null?esc(d.day):''}" placeholder="Any day"></label>
      </div>
      <div class="row2">
        <label class="f"><span>Starts</span>${monthSelect('f_start',validM(d.start)?d.start:range()[0])}</label>
        <label class="f"><span>Repeats</span><select name="f_every">${[[1,'Every month'],[2,'Every 2 months'],[3,'Every 3 months'],[6,'Every 6 months'],[12,'Once a year']].map(([v,t])=>`<option value="${v}"${Number(d.every||1)===v?' selected':''}>${t}</option>`).join('')}</select></label>
      </div>
      <div class="row2">
        <label class="f"><span>Number of payments</span><input name="f_months" inputmode="numeric" value="${d.months!=null?esc(d.months):''}" placeholder="Ongoing"></label>
        <label class="f"><span>Total to pay off</span><input name="f_total" inputmode="decimal" value="${d.total!=null?esc(d.total):''}" placeholder="No total"></label>
      </div>
      <p class="hint plan" id="ed-plan"></p>
      <fieldset class="steps"><legend>Amount changes</legend>
        <p class="hint" style="margin:0 0 8px">For a raise or a new rent, add the new amount and the month it starts.</p>
        ${d.steps.map((s,i)=>`<div class="step"><label class="f"><span>From</span>${monthSelect('f_sfrom_'+i,validM(s.from)?s.from:CUR)}</label><label class="f"><span>New amount</span><input name="f_samt_${i}" inputmode="decimal" value="${s.amount!=null?esc(s.amount):''}"></label><button type="button" class="icon-btn" data-ed="rm-step" data-i="${i}" aria-label="Remove change">×</button></div>`).join('')}
        <button type="button" class="mini" data-ed="add-step">Add a change</button>
      </fieldset>
      ${d.kind!=='in'?`<label class="check"><input type="checkbox" name="f_loan"${d.isLoan?' checked':''}>Show in Loans with a paid checklist</label>`:''}
      ${err?`<p class="err">${esc(err)}</p>`:''}
      <div class="actions">
        ${isNew?'':'<button type="button" class="btn danger" data-ed="del">Delete</button><button type="button" class="mini" data-ed="up" aria-label="Move up">↑</button><button type="button" class="mini" data-ed="down" aria-label="Move down">↓</button>'}
        <span class="sp"></span>
        <button type="submit" class="btn primary">${isNew?'Add':'Save changes'}</button>
      </div>
    </form>`);
    const f=panel.querySelector('#ed');
    const upd=()=>{read(f);$('#ed-plan').textContent=planText(d)};
    upd();
    f.addEventListener('input',upd);
    f.addEventListener('change',e=>{if(e.target.name==='f_kind'){read(f);draw()}else upd()});
    f.addEventListener('click',e=>{
      const b=e.target.closest('[data-ed]');if(!b)return;
      const a=b.dataset.ed;
      if(a==='add-step'){read(f);d.steps.push({from:CUR,amount:d.amount||0});draw()}
      else if(a==='rm-step'){read(f);d.steps.splice(Number(b.dataset.i),1);draw()}
      else if(a==='del'){armDelete(b,()=>{delDoc('rows',d.id);closeSheet()})}
      else if(a==='up'||a==='down'){move(d.id,a==='up'?-1:1)}
    });
    f.addEventListener('submit',e=>{
      e.preventDefault();read(f);
      const msg=validate();if(msg){err=msg;draw();return}
      const out={...d};
      out.amount=num(d.amount)||0;out.day=num(d.day);out.months=num(d.months);out.total=num(d.total);
      out.steps=d.steps.map(s=>({from:s.from,amount:num(s.amount)||0}));
      if(out.kind==='in')out.isLoan=false;
      saveRow(out);closeSheet();
    });
  };
  const read=f=>{
    const g=n=>{const el=f.querySelector(`[name="${n}"]`);return el?el.value:''};
    const k=f.querySelector('[name="f_kind"]:checked');if(k)d.kind=k.value;
    d.name=g('f_name').trim();d.amount=g('f_amount');d.day=g('f_day');d.start=g('f_start');
    d.every=Number(g('f_every'))||1;d.months=g('f_months');d.total=g('f_total');
    d.steps=d.steps.map((s,i)=>({from:g('f_sfrom_'+i)||s.from,amount:g('f_samt_'+i)}));
    const lc=f.querySelector('[name="f_loan"]');d.isLoan=lc?lc.checked:false;
  };
  const validate=()=>{
    if(!d.name)return 'Give this row a name.';
    const a=num(d.amount);if(a==null||isNaN(a)||a<0)return 'Enter the amount for each payment.';
    const dy=num(d.day);if(dy!=null&&(isNaN(dy)||dy<1||dy>31||dy%1))return 'Day of month should be between 1 and 31.';
    const m=num(d.months);if(m!=null&&(isNaN(m)||m<1||m%1))return 'Number of payments should be a whole number, or leave it empty for ongoing.';
    const t=num(d.total);if(t!=null&&(isNaN(t)||t<0))return 'Total should be a number, or leave it empty.';
    if(d.isLoan&&m==null&&t==null)return 'A loan needs a total or a number of payments.';
    for(const s of d.steps){const v=num(s.amount);if(v==null||isNaN(v)||v<0)return 'Each amount change needs a number.'}
    return '';
  };
  draw();
}
function move(id,dir){
  const r=S.rows.find(x=>x.id===id);if(!r)return;
  const list=(r.kind==='in'?ins():outs()).map(clone);
  const i=list.findIndex(x=>x.id===id);const j=i+dir;if(j<0||j>=list.length){toast(dir<0?'Already at the top.':'Already at the bottom.');return}
  [list[i],list[j]]=[list[j],list[i]];
  list.forEach((x,k)=>{const o=(k+1)*10;if(x.order!==o){x.order=o;saveRow(x)}});
  toast(dir<0?'Moved up.':'Moved down.');
}

/* Month cell sheet */
function openCell(id,m){
  const r=S.rows.find(x=>x.id===id);if(!r)return;
  const cur=amt(r,m),plan=planAmt(r,m),ov=has(r.overrides,m);
  const sc=sched(r);
  const panel=openSheet(`<div class="sheet-head"><div><h2 class="disp">${esc(r.name)}</h2><p>${mLabel(m)}${r.day?', on the '+ord(r.day):''}</p></div><button type="button" class="x" data-act="close" aria-label="Close">×</button></div>
    <p class="hint">Planned amount: <b class="num">${fmt(plan)}</b>${sc.finite?'. '+esc(payInfo(r,m).replace(/^Payment.*?, /,'')):''}${ov?'. This month has its own amount.':''}</p>
    <label class="f"><span>Amount for ${mLabel(m)}</span><input id="cv" inputmode="decimal" value="${cur||''}" placeholder="0"></label>
    <p class="err" id="cv-err" hidden>Enter a number, or 0 to skip this month.</p>

    </div>`);
  panel.addEventListener('click',e=>{
    const b=e.target.closest('[data-c]');if(!b)return;const a=b.dataset.c;
    if(a==='edit'){closeSheet();openRowEditor(id);return}
    const x=clone(r);x.overrides=x.overrides||{};x.steps=Array.isArray(x.steps)?x.steps:[];
    if(a==='reset'){delete x.overrides[m];saveRow(x);closeSheet();return}
    const v=num($('#cv').value);
    if(v==null||isNaN(v)||v<0){$('#cv-err').hidden=false;return}
    if(a==='only'){if(v===plan)delete x.overrides[m];else x.overrides[m]=v}
    else{
      delete x.overrides[m];
      if(validM(x.start)&&mIdx(m)<=mIdx(x.start)){x.amount=v;x.steps=x.steps.filter(s=>mIdx(s.from)>mIdx(m))}
      else{x.steps=x.steps.filter(s=>mIdx(s.from)<mIdx(m));x.steps.push({from:m,amount:v})}
    }
    saveRow(x);closeSheet();
  });
  panel.querySelector('#cv').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();panel.querySelector('[data-c="only"]').click()}});
}

async function uploadFiles(files){
  if(!assets){toast('Photo uploads aren’t available in this view.');return}
  for(const file of files){
    if(file.size>20*1024*1024){toast(file.name+' is over 20 MB. Pick a smaller photo.');continue}
    S.uploading++;scheduleRender();
    try{
      const res=await assets.upload(file);
      const base=file.name.replace(/\.[^.]+$/,'');
      await setDoc('photos',newId('photos'),{assetId:res.id,url:res.url,caption:/^(IMG|PXL|DSC|image|Screenshot|WhatsApp)/i.test(base)?'':base,createdAt:Date.now()});
    }catch(err){toast('Couldn’t upload '+file.name+'. Try again.')}
    finally{S.uploading--;scheduleRender()}
  }
}

async function makeImage(sel){
  try{await Promise.all(['700 34px "Bricolage Grotesque"','600 15px "Bricolage Grotesque"','400 14px "IBM Plex Sans"','500 14px "IBM Plex Sans"','600 14px "IBM Plex Sans"'].map(x=>document.fonts.load(x)))}catch(e){}
  const C={bg:'#FFFFFF',ink:'#172033',muted:'#5B6576',line:'#D7DCE4',in:'#157552',inS:'#DDF0E6',out:'#B9372F',outS:'#F9E1DE',left:'#2A50CC',leftS:'#E1E8FB',yr:'#9A5B00',yrS:'#FFEFCF',head:'#172033',sec:'#F4F6F9'};
  const SANS='"IBM Plex Sans","Segoe UI",Roboto,sans-serif',DISP='"Bricolage Grotesque","Segoe UI",sans-serif';
  const months=mRange(sel.from,sel.to);
  const cols=[];months.forEach((m,i)=>{cols.push({t:'m',m});const n=months[i+1];if(sel.year&&(!n||yearOf(n)!==yearOf(m)))cols.push({t:'y',y:yearOf(m),upto:m,ms:months.filter(x=>yearOf(x)===yearOf(m))})});
  const RI=ins().filter(r=>sel.rows.has(r.id)),RO=outs().filter(r=>sel.rows.has(r.id));
  const PI=sel.all?ins():RI,PO=sel.all?outs():RO;
  const inc=m=>sumBy(PI,r=>amt(r,m)),exp=m=>sumBy(PO,r=>amt(r,m));
  const widths=[250].concat(sel.cols?[60,110]:[],cols.map(c=>c.t==='m'?100:128));
  const TW=widths.reduce((s,w)=>s+w,0);
  const lines=[{t:'month'}];
  if(sel.inc)lines.push({t:'tot',label:'Income',f:inc,bg:C.inS,fg:C.in});
  if(sel.left)lines.push({t:'tot',label:'Left over',f:m=>inc(m)-exp(m),bg:C.leftS,fg:C.left});
  if(sel.exp)lines.push({t:'tot',label:'Expenses',f:exp,bg:C.outS,fg:C.out});
  if(RI.length){lines.push({t:'sec',label:'Money in'});RI.forEach(r=>lines.push({t:'row',r}))}
  if(RO.length){lines.push({t:'sec',label:'Money out'});RO.forEach(r=>lines.push({t:'row',r}))}
  const PAD=36,RH=40,TOP=PAD+86,W=Math.ceil(TW+PAD*2),H=Math.ceil(TOP+lines.length*RH+PAD+28);
  const K=2,cv=document.createElement('canvas');cv.width=W*K;cv.height=H*K;
  const g=cv.getContext('2d');g.scale(K,K);
  g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  g.textBaseline='alphabetic';g.textAlign='left';
  g.fillStyle=C.ink;g.font='700 34px '+DISP;g.fillText('To Mariam',PAD,PAD+30);
  g.fillStyle=C.muted;g.font='400 15px '+SANS;g.fillText(`${mLabel(sel.from)} to ${mLabel(sel.to)}`,PAD,PAD+58);
  const fit=(s,w)=>{s=String(s);if(g.measureText(s).width<=w)return s;while(s.length>1&&g.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'};
  g.textBaseline='middle';
  lines.forEach((ln,li)=>{
    const y=TOP+li*RH;let x=PAD;
    if(ln.t==='month'){g.fillStyle=C.head;g.fillRect(PAD,y,TW,RH)}
    else if(ln.t==='tot'){g.fillStyle=ln.bg;g.fillRect(PAD,y,TW,RH)}
    else if(ln.t==='sec'){g.fillStyle=C.sec;g.fillRect(PAD,y,TW,RH)}
    if(ln.t==='sec'){g.textAlign='left';g.fillStyle=C.ink;g.font='600 15px '+DISP;g.fillText(ln.label,PAD+12,y+RH/2)}
    else{
      const cells=[];
      if(ln.t==='month'){cells.push({txt:'Item',l:1});if(sel.cols)cells.push({txt:'Day'},{txt:'Amount'})}
      else if(ln.t==='tot'){cells.push({txt:ln.label,l:1});if(sel.cols)cells.push({txt:''},{txt:''})}
      else{const r=ln.r,sc=sched(r);cells.push({txt:r.name,l:1});if(sel.cols)cells.push({txt:r.day||'',mu:1},{txt:fmt(sc.finite?(sc.total!=null?sc.total:sc.planned):rateAt(r,sel.from))})}
      cols.forEach(c=>{
        if(ln.t==='month')cells.push({txt:c.t==='m'?mLabel(c.m):'End of '+c.y,yr:c.t==='y'});
        else if(ln.t==='tot'){const v=c.t==='m'?ln.f(c.m):sumBy(c.ms,ln.f);cells.push({txt:fmt(v),yr:c.t==='y',neg:v<0})}
        else if(c.t==='m'){const v=amt(ln.r,c.m);cells.push({txt:v?fmt(v):''})}
        else{const rem=remainingAfter(ln.r,c.upto);cells.push({txt:rem==null?'':fmt(rem),yr:1})}
      });
      cells.forEach((c,ci)=>{
        const w=widths[ci];
        if(c.yr){g.fillStyle=ln.t==='month'?C.yr:C.yrS;g.fillRect(x,y,w,RH)}
        g.fillStyle=ln.t==='month'?'#FFFFFF':ln.t==='tot'?(c.neg?C.out:ln.fg):c.yr?C.yr:c.mu?C.muted:C.ink;
        g.font=(ln.t==='row'?(ci===0?'500':c.yr?'600':'400'):'600')+' 14px '+SANS;
        const t=fit(c.txt,w-22);
        if(c.l){g.textAlign='left';g.fillText(t,x+12,y+RH/2)}else{g.textAlign='right';g.fillText(t,x+w-10,y+RH/2)}
        x+=w;
      });
      if(ln.t==='row'){g.fillStyle=ln.r.kind==='in'?C.in:C.out;g.fillRect(PAD,y,3,RH)}
    }
    g.strokeStyle=C.line;g.lineWidth=1;g.beginPath();g.moveTo(PAD,y+RH-.5);g.lineTo(PAD+TW,y+RH-.5);g.stroke();
  });
  const yB=TOP+lines.length*RH;let vx=PAD;
  g.strokeStyle=C.line;g.lineWidth=1;
  widths.slice(0,-1).forEach(w=>{vx+=w;g.beginPath();g.moveTo(vx-.5,TOP);g.lineTo(vx-.5,yB);g.stroke()});
  g.strokeRect(PAD+.5,TOP+.5,TW-1,yB-TOP-1);
  g.textAlign='left';g.textBaseline='alphabetic';g.fillStyle=C.muted;g.font='400 12px '+SANS;
  g.fillText('Prepared '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),PAD,H-PAD+12);
  return cv;
}

/* ---------- events ---------- */
function setTab(t){S.tab=t;try{history.replaceState(null,'','#'+t)}catch(e){}render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.closest('#sheet-root'))return;
  const a=el.dataset.act;
  if(a==='tab')setTab(el.dataset.tab);
  else if(a==='edit'&&S.canManage)openRowEditor(el.dataset.id);
  else if(a==='add'&&S.canManage)openRowEditor(null,{kind:el.dataset.kind,loan:el.dataset.loan==='1'});
  else if(a==='cell'&&S.canManage)openCell(el.dataset.id,el.dataset.m);
  else if(a==='toggle-loan'){const id=el.dataset.id;S.openLoans.has(id)?S.openLoans.delete(id):S.openLoans.add(id);render()}
  else if(a==='mprev'||a==='mnext'){const o=monthOptions();const i=o.indexOf(S.month)+(a==='mprev'?-1:1);if(o[i]){S.month=o[i];render()}}
  else if(a==='sha-add'&&S.canManage)openSha(null,el.dataset.side);
  else if(a==='sha-edit'&&S.canManage)openSha(el.dataset.id);
  else if(a==='photo')openPhoto(el.dataset.id);
  else if(a==='export')openExport();
});
document.addEventListener('change',e=>{
  const el=e.target;if(el.closest('#sheet-root'))return;
  if(el.dataset.act==='paid'){
    if(!S.canManage){el.checked=!el.checked;return}
    const r=S.rows.find(x=>x.id===el.dataset.id);if(!r)return;
    const x=clone(r);x.paid=x.paid||{};if(el.checked)x.paid[el.dataset.m]=true;else delete x.paid[el.dataset.m];
    saveRow(x);
  }else if(el.dataset.act==='msel'){S.month=el.value;render()}
  else if(el.id==='range-start'||el.id==='range-end'){
    let s=$('#range-start').value,t=$('#range-end').value;
    if(mIdx(t)<mIdx(s)){if(el.id==='range-start')t=s;else s=t}
    if(mIdx(t)-mIdx(s)>47){toast('Pick a range of up to 4 years.');render();return}
    setDoc('settings','main',{...S.settings,start:s,end:t});
  }else if(el.id==='photo-input'){const fl=Array.from(el.files||[]);el.value='';if(fl.length)uploadFiles(fl)}
});

/* ---------- boot ---------- */
async function init(){
  const h=(location.hash||'').slice(1);if(TABS.includes(h))S.tab=h;
  render();
  const c=window.claude;
  if(!c||typeof c.use!=='function'){S.mode='local';S.canManage=true;S.loaded=true;render();return}
  let user=null;
  try{[db,user,assets,downloads]=await Promise.all([c.use('db'),c.use('user'),c.use('assets'),c.use('downloads')])}catch(e){}
  if(!db){S.mode='nodb';S.loaded=true;render();return}
  let manage=false;
  if(user){try{const me=await user.me();S.who=me.name||'';manage=!!me.isOwner||!!me.canEdit}catch(e){}}
  S.canManage=manage;S.assetsOk=manage&&!!assets;S.mode='live';
  const onErr=e=>{if(e&&e.code==='revoked'){S.canManage=false;scheduleRender()}else toast('Live updates paused. Reload the page to reconnect.')};
  let got=0;const mark=()=>{got++;if(got>=2&&!S.loaded){S.loaded=true}};
  db.collection('rows').onSnapshot(s=>{S.rows=s.docs.map(d=>({id:d.id,...d.data()}));mark();scheduleRender()},onErr);
  db.collection('settings').doc('main').onSnapshot(s=>{S.settings={...DEFAULTS,...(s.exists?s.data():{})};mark();scheduleRender()},onErr);
  db.collection('sha2a').onSnapshot(s=>{S.sha2a=s.docs.map(d=>({id:d.id,...d.data()}));scheduleRender()},onErr);
  db.collection('photos').onSnapshot(s=>{S.photos=s.docs.map(d=>({id:d.id,...d.data()}));scheduleRender()},onErr);
  render();
}
init();
})();
</script>
