<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12B76A" />
      <stop offset="100%" stop-color="#067647" />
    </linearGradient>
  </defs>

  <!-- Diagonal green gradient background -->
  <rect width="108" height="108" fill="url(#bg-gradient)" />

  <!-- Peeking coin with bold rounded "P" cut out -->
  <path
      fill="#FFFFFF"
      fill-rule="evenodd"
      d="M 66.12,45.6 A 13.8,13.8 0 1,0 41.88,45.6 Z M 50.6,28.85 L 54.75,28.85 A 4.5,4.5 0 0,1 54.75,37.85 L 52.15,37.85 L 52.15,41.1 A 1.55,1.55 0 0,1 49.05,41.1 L 49.05,30.4 A 1.55,1.55 0 0,1 50.6,28.85 Z M 52.15,31.6 L 54.75,31.6 A 1.75,1.75 0 0,1 54.75,35.1 L 52.15,35.1 Z" />

  <!-- Wallet clasp strap with snap button cutout -->
  <path
      fill="#FFFFFF"
      fill-rule="evenodd"
      d="M 66.3,58.95 L 75.5,58.95 L 75.5,69.55 L 66.3,69.55 A 5.3,5.3 0 0,1 66.3,58.95 Z M 66.4,61.9 A 2.35,2.35 0 1,0 66.4,66.6 A 2.35,2.35 0 1,0 66.4,61.9 Z" />

  <!-- Wallet outer outline (7dp thick stroke, rounded corners and joins) -->
  <path
      fill="none"
      stroke="#FFFFFF"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M 39,51.5 L 69,51.5 A 6.5,6.5 0 0,1 75.5,58 L 75.5,70.5 A 6.5,6.5 0 0,1 69,77 L 39,77 A 6.5,6.5 0 0,1 32.5,70.5 L 32.5,58 A 6.5,6.5 0 0,1 39,51.5 Z" />
</svg>
